<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- ============================================================
     1) LINK PREVIEW (what the chat app shows). Chat apps read these
        tags without running JavaScript, so they must be edited here.
        og:image should be a direct https link to a JPG/PNG, ideally
        1200x630. Upload your thumbnail next to this file as thumb.jpg
        and use its full URL, e.g. https://yourdomain.com/thumb.jpg
     ============================================================ -->
<title>Caleb Downs lets Scary Terry know who's boss</title>
<meta name="description" content="Hard hit causes pass break-up!">
<meta property="og:type" content="video.other">
<meta property="og:site_name" content="YouTube">
<meta property="og:title" content="Week 2 hit everyone is talking about">
<meta property="og:description" content="Caleb Downs lets Scary Terry know who's boss">
<meta property="og:image" content="https://djkrush.github.io/rickroll/thumb.jpg">
<meta property="og:image:width" content="482">
<meta property="og:image:height" content="860">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Week 2 hit everyone is talking about">
<meta name="twitter:description" content="Caleb Downs lets Scary Terry know who's boss">
<meta name="twitter:image" content="https://djkrush.github.io/rickroll/thumb.jpg">

<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f0f0f; color: #f1f1f1;
    font-family: Roboto, Arial, system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: 12px; overflow: hidden; }
  .player iframe, #yt, #rick { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* The Rick player sits behind the decoy at opacity 0 while it burns off any
     pre-roll ad. Opacity, not display:none — a hidden player may stop playing. */
  #rick { opacity: 0; z-index: 0; }
  #yt { z-index: 1; }
  /* Must out-rank #yt's z-index 1, or the real YouTube poster and title bar show. */
  #cover { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center;
    justify-content: center; background: #000 center / cover no-repeat; cursor: pointer; }
  #cover::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); }
  #cover button { position: relative; z-index: 1; width: 68px; height: 48px; border: 0; border-radius: 12px;
    background: #f00; display: grid; place-items: center; cursor: pointer; }
  #cover button::before { content: ""; border-style: solid; border-width: 10px 0 10px 18px;
    border-color: transparent transparent transparent #fff; margin-left: 4px; }
  h1 { font-size: 20px; margin: 14px 0 4px; }
  .meta { color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <div id="rick"></div>
    <div id="yt"></div>
    <div id="cover"><button aria-label="Play"></button></div>
  </div>
  <h1 id="h1"></h1>
  <div class="meta">1.2M views &middot; 2 days ago</div>
</div>

<script>
// ============================================================
// 2) THE PRANK. Edit these values.
// ============================================================
const CONFIG = {
  decoyVideoId:      "_7NS-v3nt70", // the 11-char id from youtube.com/watch?v=XXXXXXXXXXX
  decoyStartSeconds: 0,      // skip the decoy's intro if you want
  switchAfterSeconds: 7,    // how long the decoy plays before the switch
  rickVideoId:       "dQw4w9WgXcQ",
  rickStartSeconds:  43,      // 0 = drum intro, 43 = straight into the chorus
  coverImage:        "thumb.jpg", // shown before they press play; same image as og:image works well

  // Loading a video is what triggers a pre-roll ad, so Rick is loaded up front in a
  // second, hidden, muted player. Any ad plays there unseen while the decoy is on
  // screen; the switch then just swaps which player is visible, which shows no ad.
  // Set false to go back to swapping the video inside the one player.
  preloadRick:       true,
  // A pre-roll reports its OWN duration; the song is 3:32. A reported duration longer
  // than this means the ad is over and the real video is what's playing.
  realVideoMinSeconds: 90,
  // If an ad somehow outlasts this, switch anyway rather than never switching.
  maxPreloadWaitSeconds: 25,
};

document.getElementById("h1").textContent = document.title;
const cover = document.getElementById("cover");
cover.style.backgroundImage = `url("${CONFIG.coverImage}")`;

// Load the YouTube IFrame API
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

let player, rick, switched = false, timer = null, adTimer = null;
let rickArmed = false;      // Rick is past any ad, parked at rickStartSeconds, ready to show
let decoyDone = false;      // the decoy has played its switchAfterSeconds
let waitingSince = null;    // when we started waiting on a slow ad

function onYouTubeIframeAPIReady() {
  player = new YT.Player("yt", {
    videoId: CONFIG.decoyVideoId,
    playerVars: { start: CONFIG.decoyStartSeconds, rel: 0, playsinline: 1, modestbranding: 1,
                  origin: location.origin },
    events: { onStateChange: onStateChange }
  });

  if (!CONFIG.preloadRick) return;
  rick = new YT.Player("rick", {
    videoId: CONFIG.rickVideoId,
    playerVars: { rel: 0, playsinline: 1, modestbranding: 1, controls: 0,
                  origin: location.origin },
    events: { onReady: burnAd, onStateChange: watchForRealVideo, onError: giveUpOnPreload }
  });
}

// Muted playback is allowed without a user gesture, so the ad can start running
// before they have even pressed play on the decoy.
function burnAd() {
  rick.mute();
  rick.playVideo();
}

function watchForRealVideo(e) {
  if (rickArmed || adTimer || e.data !== YT.PlayerState.PLAYING) return;
  adTimer = setInterval(() => {
    if (rick.getDuration() <= CONFIG.realVideoMinSeconds || rick.getCurrentTime() <= 0) return;
    clearInterval(adTimer);
    adTimer = null;
    rick.pauseVideo();                            // parked, so no reload = no second ad
    rick.seekTo(CONFIG.rickStartSeconds, true);
    rickArmed = true;
    if (decoyDone) rickroll();                    // decoy already hit its mark; go now
  }, 250);
}

function giveUpOnPreload() {
  rick = null;                                    // fall back to swapping in one player
}

// The user's tap is the "user gesture" browsers require before playing with sound.
cover.addEventListener("click", () => {
  if (!player) return;
  cover.style.display = "none";
  player.playVideo();
  if (rick && !rickArmed) burnAd();               // in case muted autoplay was blocked
});

function onStateChange(e) {
  if (switched) return;
  if (e.data === YT.PlayerState.PLAYING && !timer) {
    timer = setInterval(() => {
      if (player.getCurrentTime() - CONFIG.decoyStartSeconds < CONFIG.switchAfterSeconds) return;
      if (!decoyDone) { decoyDone = true; waitingSince = Date.now(); }
      // Let the decoy run a little long rather than cut to an ad.
      if (!rick || rickArmed) rickroll();
      else if (Date.now() - waitingSince >= CONFIG.maxPreloadWaitSeconds * 1000) rickroll();
    }, 250);
  }
}

function rickroll() {
  if (switched) return;
  switched = true;
  clearInterval(timer);
  clearInterval(adTimer);

  if (!rickArmed) {   // no preload available: the old way, ad and all
    if (rick) rick.stopVideo();
    player.loadVideoById({ videoId: CONFIG.rickVideoId, startSeconds: CONFIG.rickStartSeconds });
    return;
  }

  const decoyFrame = player.getIframe(), rickFrame = rick.getIframe();
  rickFrame.style.opacity = "1";
  rickFrame.style.zIndex = "1";
  decoyFrame.style.opacity = "0";
  decoyFrame.style.zIndex = "0";
  player.stopVideo();
  rick.seekTo(CONFIG.rickStartSeconds, true);
  rick.unMute();
  rick.playVideo();
}
</script>
</body>
</html>
